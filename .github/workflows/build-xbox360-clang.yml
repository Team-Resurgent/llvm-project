# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# Build the Xbox 360 (MS-PPC) clang + lld for Windows x64 and publish a
# moving "latest" GitHub Release. Matches tools/build-llvm.bat in RXDK-360.

name: Xbox 360 clang (Windows)

on:
  push:
    branches: [teamresurgent]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (empty = move the rolling "latest" release)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: xbox360-clang-windows
  cancel-in-progress: true

jobs:
  build:
    name: xbox360-windows-x64
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Checkout (compiler cone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            llvm
            clang
            lld
            cmake
            third-party
            libc
            libunwind
            libcxx
            libcxxabi

      - name: Locate VS + Ninja
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio with C++ tools not found" }
          $ninja = Join-Path $vs "Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe"
          if (-not (Test-Path $ninja)) { throw "Ninja not found under $vs" }
          echo "vs=$vs" >> $env:GITHUB_OUTPUT
          echo "ninja=$ninja" >> $env:GITHUB_OUTPUT
          echo "VS=$vs"
          echo "Ninja=$ninja"

      - name: Configure
        shell: cmd
        run: |
          call "${{ steps.vs.outputs.vs }}\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -G Ninja -S llvm -B build ^
            -DCMAKE_MAKE_PROGRAM="${{ steps.vs.outputs.ninja }}" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DLLVM_ENABLE_PROJECTS="clang;lld" ^
            -DLLVM_TARGETS_TO_BUILD=PowerPC ^
            -DLLVM_ENABLE_ASSERTIONS=ON ^
            -DLLVM_OPTIMIZED_TABLEGEN=ON ^
            -DLLVM_APPEND_VC_REV=OFF ^
            -DLLVM_INCLUDE_TESTS=OFF ^
            -DLLVM_INCLUDE_BENCHMARKS=OFF ^
            -DLLVM_INCLUDE_EXAMPLES=OFF ^
            -DCLANG_INCLUDE_TESTS=OFF ^
            -DLLVM_ENABLE_ZLIB=OFF ^
            -DLLVM_ENABLE_ZSTD=OFF ^
            -DLLVM_ENABLE_LIBXML2=OFF
          if errorlevel 1 exit /b 1

      - name: Build clang + lld
        shell: cmd
        run: |
          call "${{ steps.vs.outputs.vs }}\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --build build --target clang lld llc
          if errorlevel 1 exit /b 1

      - name: Package
        shell: pwsh
        run: |
          $root = "xbox360-windows-x64"
          New-Item -ItemType Directory -Force -Path "$root/bin","$root/lib" | Out-Null
          foreach ($n in @("clang.exe","clang++.exe","ld.lld.exe","lld.exe","llvm-ar.exe","llc.exe")) {
            $src = "build/bin/$n"
            if (Test-Path $src) { Copy-Item $src "$root/bin/" }
          }
          if (-not (Test-Path "$root/bin/clang.exe")) { throw "clang.exe missing" }
          if (-not (Test-Path "$root/bin/ld.lld.exe")) { throw "ld.lld.exe missing" }
          if (-not (Test-Path "$root/bin/clang++.exe") -and (Test-Path "$root/bin/clang.exe")) {
            Copy-Item "$root/bin/clang.exe" "$root/bin/clang++.exe"
          }
          if (Test-Path "build/lib/clang") {
            Copy-Item "build/lib/clang" "$root/lib/clang" -Recurse
          }

          function Copy-Needed([string]$src, [string]$dst) {
            if (-not (Test-Path $src)) { throw "missing $src" }
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            & robocopy $src $dst /E /XD test tests docs examples benchmarks utils cmake Documentation /NFL /NDL /NJH /NJS /nc /ns /np | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "robocopy $src failed ($LASTEXITCODE)" }
          }
          Copy-Needed "libcxx/include" "$root/libcxx/include"
          Copy-Needed "libcxx/src" "$root/libcxx/src"
          Copy-Needed "libcxxabi/include" "$root/libcxxabi/include"
          Copy-Needed "libcxxabi/src" "$root/libcxxabi/src"
          Copy-Needed "libunwind/include" "$root/libunwind/include"
          Copy-Needed "libunwind/src" "$root/libunwind/src"
          if (Test-Path "libc/include") { Copy-Needed "libc/include" "$root/libc/include" }
          if (Test-Path "libc/shared") { Copy-Needed "libc/shared" "$root/libc/shared" }
          if (Test-Path "libc/src/__support") { Copy-Needed "libc/src/__support" "$root/libc/src/__support" }

          foreach ($p in @(
            "$root/lib/clang",
            "$root/libcxx/include",
            "$root/libcxx/src",
            "$root/libcxxabi/include",
            "$root/libcxxabi/src",
            "$root/libunwind/include",
            "$root/libunwind/src"
          )) {
            if (-not (Test-Path $p)) { throw "package missing $p" }
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $root -DestinationPath "dist/$root.zip" -Force
          Get-Item "dist/$root.zip" | Format-List Name, Length

      - name: Smoke-test clang
        shell: pwsh
        run: |
          $out = & "xbox360-windows-x64/bin/clang.exe" --version 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "clang") { throw "unexpected clang --version" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbox360-windows-x64
          path: dist/xbox360-windows-x64.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build]
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: xbox360-windows-x64
          path: dist

      - name: Determine release tag
        id: meta
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            tag="${{ github.event.inputs.release_tag }}"
            moving=false
          else
            tag="latest"
            moving=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "moving=$moving" >> "$GITHUB_OUTPUT"

      - name: Move the rolling latest release
        if: steps.meta.outputs.moving == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo "${{ github.repository }}" --cleanup-tag --yes || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Xbox 360 clang ${{ steps.meta.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: dist/xbox360-windows-x64.zip
