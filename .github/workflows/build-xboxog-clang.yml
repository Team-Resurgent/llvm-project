# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# Build the original Xbox clang + lld for each host OS/arch and publish into
# the shared "latest" GitHub Release, alongside the Xbox 360 zips from
# build-xbox360-clang.yml. The compiler targets the stock i686-pc-
# windows-gnu triple (no custom triple patches needed -- unlike Xbox 360's
# powerpc-unknown-xbox360, x86 Windows-GNU-ABI is already a first-class LLVM
# target); host zips are named xboxog-<os>-<arch>.

name: Original Xbox clang

on:
  push:
    branches: [xboxog]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (empty = move the rolling "latest" release)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: xboxog-clang
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: xboxog-windows-x64
            os: windows-2022
            vcvars: vcvars64.bat
          - name: xboxog-windows-arm64
            os: windows-11-vs2026-arm
            vcvars: vcvarsarm64.bat
          - name: xboxog-linux-x64
            os: ubuntu-24.04
          - name: xboxog-linux-arm64
            os: ubuntu-24.04-arm
          - name: xboxog-macos-x64
            os: macos-15-intel
          - name: xboxog-macos-arm64
            os: macos-15
    steps:
      - name: Checkout (compiler cone)
        uses: actions/checkout@v4
        with:
          # teamresurgent is a thin CI-only branch (no llvm/ source); when run via
          # workflow_dispatch from the default branch, pin the checkout to the xboxog
          # source branch so there is something to build.
          ref: xboxog
          fetch-depth: 1
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            llvm
            clang
            lld
            cmake
            third-party
            libc
            libunwind
            libcxx
            libcxxabi

      - name: Install Ninja (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install ninja
          fi
          ninja --version

      - name: Locate VS + Ninja
        if: runner.os == 'Windows'
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            $vs = & $vswhere -latest -products * -property installationPath
          }
          if (-not $vs) { throw "Visual Studio not found" }
          $ninja = Join-Path $vs "Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe"
          if (-not (Test-Path $ninja)) { throw "Ninja not found under $vs" }
          echo "vs=$vs" >> $env:GITHUB_OUTPUT
          echo "ninja=$ninja" >> $env:GITHUB_OUTPUT
          echo "VS=$vs"
          echo "Ninja=$ninja"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "${{ steps.vs.outputs.vs }}\VC\Auxiliary\Build\${{ matrix.vcvars }}" || exit /b 1
          cmake -G Ninja -S llvm -B build ^
            -DCMAKE_MAKE_PROGRAM="${{ steps.vs.outputs.ninja }}" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DLLVM_ENABLE_PROJECTS="clang;lld" ^
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" ^
            -DLLVM_ENABLE_ASSERTIONS=ON ^
            -DLLVM_OPTIMIZED_TABLEGEN=ON ^
            -DLLVM_APPEND_VC_REV=OFF ^
            -DLLVM_INCLUDE_TESTS=OFF ^
            -DLLVM_INCLUDE_BENCHMARKS=OFF ^
            -DLLVM_INCLUDE_EXAMPLES=OFF ^
            -DCLANG_INCLUDE_TESTS=OFF ^
            -DLLVM_ENABLE_ZLIB=OFF ^
            -DLLVM_ENABLE_ZSTD=OFF ^
            -DLLVM_ENABLE_LIBXML2=OFF
          if errorlevel 1 exit /b 1

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_OPTIMIZED_TABLEGEN=ON \
            -DLLVM_APPEND_VC_REV=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF

      - name: Build clang + lld (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "${{ steps.vs.outputs.vs }}\VC\Auxiliary\Build\${{ matrix.vcvars }}" || exit /b 1
          cmake --build build --target clang lld llc llvm-ar llvm-lib
          if errorlevel 1 exit /b 1

      - name: Build clang + lld (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build --target clang lld llc llvm-ar llvm-lib

      # compiler-rt builtins the title link needs. The build above does not build compiler-rt,
      # and a title is linked -nostdlib (clang then provides no builtins), so the SDK libs' 64-bit
      # integer helpers (__divdi3/__udivdi3/__moddi3/__umoddi3, from libcompat's __alldiv shim and
      # picolibc's __ultoa_invert) plus the i386 stack probes (__alloca/__chkstk) are undefined --
      # a title fails to link with "undefined symbol: ___divdi3". Compile the classic i386 subset
      # with the just-built clang for the i686-pc-windows-gnu target and drop the archive into the
      # clang resource dir (build/lib/clang/<ver>/lib/windows); the Package step's lib/clang copy
      # then carries it into every platform zip. It is i386 target code, so it is host-agnostic and
      # the same step runs identically on Windows/macOS/Linux. (Mirrors RXDK-Libs
      # tools/build-rt-builtins.ps1, which was the manual stopgap until CI shipped this.)
      - name: Build compiler-rt i386 builtins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = if ($IsWindows) { ".exe" } else { "" }
          $clang = "build/bin/clang$exe"
          $ar = "build/bin/llvm-ar$exe"
          $bsrc = "compiler-rt/lib/builtins"
          if (-not (Test-Path $clang)) { throw "clang not built at $clang" }
          if (-not (Test-Path $bsrc)) { throw "compiler-rt builtins source missing at $bsrc" }
          $ver = Get-ChildItem "build/lib/clang" -Directory | Select-Object -First 1
          if (-not $ver) { throw "no build/lib/clang/<ver> resource dir" }
          $outDir = Join-Path $ver.FullName "lib/windows"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          # Integer/fp helper subset only -- NOT emutls/mem/OS builtins, which the RXDK libs define
          # and would collide with as duplicate strong symbols.
          $files = @(
            'divdi3','udivdi3','moddi3','umoddi3','udivmoddi4','divmoddi4',
            'ashldi3','ashrdi3','lshrdi3','muldi3','negdi2','cmpdi2','ucmpdi2',
            'floatdidf','floatdisf','floatundidf','floatundisf',
            'fixdfdi','fixsfdi','fixunsdfdi','fixunssfdi',
            'floatdixf','floatundixf','fixxfdi','fixunsxfdi',
            'mulodi4','muloti4','absvdi2','negvdi2'
          )
          $asm = @('i386/chkstk','i386/chkstk2')   # __chkstk / __chkstk_ms / _alloca
          $tmp = Join-Path ([System.IO.Path]::GetTempPath()) ("rxdk-rt-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $objs = @()
          foreach ($f in $files) {
            $src = Join-Path $bsrc "$f.c"
            if (-not (Test-Path $src)) { Write-Warning "no source $f.c"; continue }
            $obj = Join-Path $tmp "$f.o"
            & $clang '--target=i686-pc-windows-gnu' '-march=pentium3' '-O2' '-ffreestanding' '-fno-stack-protector' '-c' $src '-o' $obj
            if ($LASTEXITCODE -ne 0) { throw "compile failed: $f.c" }
            $objs += $obj
          }
          foreach ($f in $asm) {
            $src = Join-Path $bsrc "$f.S"
            if (-not (Test-Path $src)) { Write-Warning "no source $f.S"; continue }
            $obj = Join-Path $tmp (($f -replace '[\\/]','_') + ".o")
            & $clang '--target=i686-pc-windows-gnu' '-march=pentium3' '-c' $src '-o' $obj
            if ($LASTEXITCODE -ne 0) { throw "assemble failed: $f.S" }
            $objs += $obj
          }
          $outLib = Join-Path $outDir "libclang_rt.builtins-i386.a"
          if (Test-Path $outLib) { Remove-Item $outLib -Force }
          & $ar rcs $outLib @objs
          if ($LASTEXITCODE -ne 0) { throw "archiving failed" }
          if (-not (Test-Path $outLib)) { throw "builtins archive not produced" }
          Write-Host ("OK  {0}  ({1} objects)" -f $outLib, $objs.Count)

      # Make the shipped clang host-capable on Windows: fetch an llvm-mingw release
      # (a cross toolchain carrying every target's sysroot) so the Package step can
      # bundle a mingw sysroot. Then `clang --target=<arch>-w64-mingw32 --sysroot
      # <pkg>/host-sysroot` builds native host tools with no MSVC. Target-agnostic,
      # so xboxog and xbox360 use the identical step. Linux/macOS need nothing (the
      # system sysroot builds host tools).
      - name: Fetch mingw host sysroot (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # gh authenticates via GH_TOKEN, avoiding the low unauthenticated GitHub
          # API rate limit that shared runner IPs hit (the previous Invoke-RestMethod
          # to /releases/latest failed with "API rate limit exceeded").
          gh release download --repo mstorsjo/llvm-mingw `
            --pattern '*ucrt-x86_64.zip' --output mingw.zip --clobber
          Expand-Archive mingw.zip -DestinationPath mingw-extract -Force
          $mroot = (Get-ChildItem mingw-extract -Directory | Select-Object -First 1).FullName
          echo "MINGW_ROOT=$mroot" >> $env:GITHUB_ENV

      - name: Package
        shell: pwsh
        run: |
          $root = "${{ matrix.name }}"
          $exe = if ($IsWindows) { ".exe" } else { "" }
          New-Item -ItemType Directory -Force -Path "$root/bin","$root/lib" | Out-Null
          foreach ($n in @("clang","clang++","ld.lld","lld","llvm-ar","llvm-lib","llc")) {
            $src = "build/bin/$n$exe"
            if (Test-Path $src) { Copy-Item $src "$root/bin/" }
          }
          if (-not (Test-Path "$root/bin/clang$exe")) { throw "clang$exe missing" }
          if (-not (Test-Path "$root/bin/ld.lld$exe")) { throw "ld.lld$exe missing" }
          if (-not (Test-Path "$root/bin/llvm-ar$exe")) { throw "llvm-ar$exe missing" }
          if (-not (Test-Path "$root/bin/llvm-lib$exe")) { throw "llvm-lib$exe missing" }
          if (-not (Test-Path "$root/bin/clang++$exe") -and (Test-Path "$root/bin/clang$exe")) {
            Copy-Item "$root/bin/clang$exe" "$root/bin/clang++$exe"
          }
          if (Test-Path "build/lib/clang") {
            Copy-Item "build/lib/clang" "$root/lib/clang" -Recurse
          }

          $skip = @("test","tests","docs","examples","benchmarks","utils","cmake","Documentation")
          function Copy-Needed([string]$src, [string]$dst) {
            if (-not (Test-Path $src)) { throw "missing $src" }
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Get-ChildItem $src -Force | Where-Object { $skip -notcontains $_.Name } | ForEach-Object {
              Copy-Item $_.FullName $dst -Recurse -Force
            }
          }
          Copy-Needed "libcxx/include" "$root/libcxx/include"
          Copy-Needed "libcxx/src" "$root/libcxx/src"
          Copy-Needed "libcxxabi/include" "$root/libcxxabi/include"
          Copy-Needed "libcxxabi/src" "$root/libcxxabi/src"
          Copy-Needed "libunwind/include" "$root/libunwind/include"
          Copy-Needed "libunwind/src" "$root/libunwind/src"
          if (Test-Path "libc/include") { Copy-Needed "libc/include" "$root/libc/include" }
          if (Test-Path "libc/shared") { Copy-Needed "libc/shared" "$root/libc/shared" }
          if (Test-Path "libc/src/__support") { Copy-Needed "libc/src/__support" "$root/libc/src/__support" }
          Copy-Needed "libc/hdr" "$root/libc/hdr"

          foreach ($p in @(
            "$root/lib/clang",
            "$root/libcxx/include",
            "$root/libcxx/src",
            "$root/libcxxabi/include",
            "$root/libcxxabi/src",
            "$root/libunwind/include",
            "$root/libunwind/src",
            "$root/libc/hdr"
          )) {
            if (-not (Test-Path $p)) { throw "package missing $p" }
          }
          # The i386 compiler-rt builtins must have landed in the resource dir (see the builtins
          # step); without it every title link fails with undefined ___divdi3. Fail loudly here.
          if (-not (Get-ChildItem "$root/lib/clang" -Recurse -Filter 'libclang_rt.builtins-i386.a' -ErrorAction SilentlyContinue)) {
            throw "package missing libclang_rt.builtins-i386.a under $root/lib/clang"
          }

          # Host sysroot (Windows only): assemble a trimmed mingw sysroot under
          # $root/host-sysroot so the shipped clang can build native host tools.
          # Keep only this package's host arch + the c++/mingw headers + the
          # compiler-rt builtins; drop the other targets, sanitizers and fuzzer.
          if ($IsWindows) {
            $mroot = $env:MINGW_ROOT
            if (-not $mroot -or -not (Test-Path $mroot)) { throw "MINGW_ROOT not set/found" }
            $arch = if ($root -like '*arm64*') { 'aarch64' } else { 'x86_64' }
            $triple = "$arch-w64-mingw32"
            $sr = "$root/host-sysroot"
            New-Item -ItemType Directory -Force -Path $sr | Out-Null
            Copy-Item "$mroot/include" "$sr/include" -Recurse -Force
            Copy-Item "$mroot/$triple" "$sr/$triple" -Recurse -Force
            $rt = Get-ChildItem "$mroot/lib/clang" -Directory | Select-Object -First 1
            $rtroot = "$sr/lib/clang/$($rt.Name)"
            New-Item -ItemType Directory -Force -Path "$rtroot/lib/windows" | Out-Null
            # Overriding -resource-dir to this bundle means it must carry BOTH the
            # clang builtin headers (mm_malloc.h, stddef.h, ...) and the host-arch
            # compiler-rt builtins -- headers alone or builtins alone breaks builds.
            Copy-Item "$($rt.FullName)/include" "$rtroot/include" -Recurse -Force
            Get-ChildItem "$($rt.FullName)/lib/windows/libclang_rt.builtins-*.a" |
              Copy-Item -Destination "$rtroot/lib/windows" -Force
            if (-not (Test-Path "$sr/include/stdio.h")) { throw "host-sysroot missing stdio.h" }
            if (-not (Test-Path "$sr/$triple/lib/crt2.o")) { throw "host-sysroot missing crt2.o" }
            if (-not (Test-Path "$rtroot/include/mm_malloc.h")) { throw "host-sysroot missing builtin headers" }
            Write-Host "host-sysroot bundled ($triple)"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $root -DestinationPath "dist/$root.zip" -Force
          Get-Item "dist/$root.zip" | Format-List Name, Length

      - name: Smoke-test clang
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { ".exe" } else { "" }
          $clang = "${{ matrix.name }}/bin/clang$exe"
          $out = & $clang --version 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "clang") { throw "unexpected clang --version" }

          # Host-compile check: the packaged clang must build a native host exe.
          # Windows goes through the bundled mingw sysroot; Unix uses the system one.
          '#include <stdio.h>' | Out-File -Encoding ascii hosttest.c
          '#include <stdlib.h>' | Add-Content hosttest.c
          'int main(void){void*p=malloc(8);free(p);puts("rxdk host clang ok");return p?0:1;}' | Add-Content hosttest.c
          if ($IsWindows) {
            $arch = if ('${{ matrix.name }}' -like '*arm64*') { 'aarch64' } else { 'x86_64' }
            $sr = (Resolve-Path "${{ matrix.name }}/host-sysroot").Path
            $rd = (Get-ChildItem "$sr/lib/clang" -Directory | Select-Object -First 1).FullName
            & $clang --target="$arch-w64-mingw32" -fuse-ld=lld --sysroot="$sr" `
              "-resource-dir=$rd" --rtlib=compiler-rt --unwindlib=libunwind `
              hosttest.c -o hosttest$exe
          } elseif ($IsMacOS) {
            $macarch = if ('${{ matrix.name }}' -like '*arm64*') { 'arm64' } else { 'x86_64' }
            $sdk = (& xcrun --show-sdk-path).Trim()
            & $clang --target="$macarch-apple-darwin" -isysroot $sdk hosttest.c -o hosttest$exe
          } else {
            $arch = if ('${{ matrix.name }}' -like '*arm64*') { 'aarch64' } else { 'x86_64' }
            & $clang --target="$arch-unknown-linux-gnu" hosttest.c -o hosttest$exe
          }
          if ($LASTEXITCODE -ne 0) { throw "host compile failed" }
          if (-not (Test-Path "hosttest$exe")) { throw "no host exe produced" }
          Write-Host "host exe built OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build]
    if: >
      always() &&
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || github.ref_name == 'xboxog')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Determine release tag
        id: meta
        shell: bash
        run: |
          ls -la dist || true
          if [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            tag="${{ github.event.inputs.release_tag }}"
          else
            tag="latest"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          shopt -s nullglob
          zips=(dist/xboxog-*.zip)
          if [[ ${#zips[@]} -eq 0 ]]; then
            echo "no host zips produced" >&2
            exit 1
          fi

      # The release is NOT deleted first: the Xbox 360 pipeline shares it.
      # Uploading replaces same-named assets only, so xbox360-*.zip survives.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Team Resurgent clang ${{ steps.meta.outputs.tag }}
          make_latest: true
          body: |
            Rolling clang/lld builds for Team Resurgent's Xbox targets.

            - `xbox360-<os>-<arch>.zip` - Xbox 360, target `powerpc-unknown-xbox360` (branch `xbox360`)
            - `xboxog-<os>-<arch>.zip` - original Xbox, target `i686-pc-windows-gnu` (branch `xboxog`)

            Each pipeline replaces only its own zips, so both sets live here.
          files: dist/xboxog-*.zip
